<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Слова каждый день</title>
<meta name="description" content="Английские и латышские слова A1–B2 с интервальным повторением">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Слова">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=Urbanist:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — cards on a cool grey ground, bottom tab bar, session screens fill the height */
:root {
  --bg: #F3F4F6;
  --surface: #FFFFFF;
  --surface-2: #F3F4F6;
  --muted: #E8EAEF;
  --line: #E3E5EA;
  --line-strong: #D5D8E0;
  --fg: #1A2238;
  --fg-2: #5A6275;
  --fg-3: #6B7386;
  --primary: #1A2238;
  --primary-fg: #FFFFFF;
  --primary-sub: #C5CBDD;
  --hero: #1A2238;
  --hero-fg: #FFFFFF;
  --hero-sub: #C5CBDD;
  --hero-track: #AEB8D6;
  --accent: #FFE25A;
  --accent-fg: #1A2238;
  --soft: #E6E9F3;
  --soft-fg: #1A2238;
  --warn-bg: #FFE7D6;
  --warn-fg: #8A3409;
  --flame: #C2410C;
  --focus: #3B5BDB;
  --backdrop: rgba(15, 19, 34, 0.45);
  --font: 'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --sat: 0px;
  --sab: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1322; --surface: #1A2033; --surface-2: #232A40; --muted: #2A3149; --line: #2C3450; --line-strong: #3A4364;
    --fg: #EEF0F6; --fg-2: #A3AAC0; --fg-3: #8E96AE;
    --primary: #E4E8F4; --primary-fg: #121628; --primary-sub: #4A5370;
    --hero: #232B4A; --hero-fg: #FFFFFF; --hero-sub: #AEB6CF; --hero-track: #5C6894;
    --accent: #FFE25A; --accent-fg: #1A2238;
    --soft: #262E48; --soft-fg: #E4E8F4;
    --warn-bg: #3A2418; --warn-fg: #FFB98A; --flame: #FF8A4C;
    --focus: #8FA8FF; --backdrop: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1322; --surface: #1A2033; --surface-2: #232A40; --muted: #2A3149; --line: #2C3450; --line-strong: #3A4364;
  --fg: #EEF0F6; --fg-2: #A3AAC0; --fg-3: #8E96AE;
  --primary: #E4E8F4; --primary-fg: #121628; --primary-sub: #4A5370;
  --hero: #232B4A; --hero-fg: #FFFFFF; --hero-sub: #AEB6CF; --hero-track: #5C6894;
  --accent: #FFE25A; --accent-fg: #1A2238;
  --soft: #262E48; --soft-fg: #E4E8F4;
  --warn-bg: #3A2418; --warn-fg: #FFB98A; --flame: #FF8A4C;
  --focus: #8FA8FF; --backdrop: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 17px; line-height: 1.35;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
mark { background: var(--accent); color: #1A2238; padding: 0 4px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }

#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.scroll.gutter { padding-top: calc(var(--sat) + 14px); padding-bottom: 20px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.footer { padding-top: 12px; padding-bottom: calc(var(--sab) + 16px); display: flex; flex-direction: column; gap: 8px; }

/* Type */
.eyebrow { font-size: 15px; font-weight: 500; color: var(--fg-2); }
.large-title { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.4px; }
.h1 { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.4px; margin: 22px 4px 8px; }
.lead { font-size: 17px; line-height: 23px; color: var(--fg-2); margin: 0 4px 20px; }
.section-title { font-size: 17px; line-height: 22px; font-weight: 600; }
.small { font-size: 15px; line-height: 20px; color: var(--fg-2); }
.footnote { font-size: 15px; line-height: 20px; color: var(--fg-2); text-align: center; }
.num { font-variant-numeric: tabular-nums; }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  min-height: 56px; padding: 0 16px; border: 0; border-radius: 16px;
  font-size: 17px; font-weight: 700; text-decoration: none; text-align: center;
}
.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-accent { background: var(--accent); color: var(--accent-fg); }
.btn-outline { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.btn-ghost { background: transparent; color: var(--fg); flex-direction: column; gap: 2px; font-weight: 600; }
.btn-ghost small { font-size: 13px; font-weight: 500; color: var(--fg-2); }
.btn-danger { background: var(--warn-bg); color: var(--warn-fg); }
.btn:disabled { background: var(--muted); color: var(--fg-2); box-shadow: none; cursor: default; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.btn-row .btn.grow { flex: 1.5; }
.icon-btn {
  width: 44px; height: 44px; flex: none; border: 0; border-radius: 14px;
  background: var(--surface); color: var(--fg);
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn.round { border-radius: 50%; background: var(--surface-2); }
.icon-btn.plain { background: transparent; }

/* Cards */
.card { background: var(--surface); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 24px; }
.link-btn { border: 0; background: none; padding: 0 4px; margin: -10px -4px; font-size: 15px; font-weight: 600; color: var(--fg); min-height: 44px; }

/* Onboarding */
.ob-head { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 4px; }
.ob-step { font-size: 15px; font-weight: 600; color: var(--fg-2); }
.ob-bars { flex: 1; display: flex; gap: 6px; }
.ob-bars span { flex: 1; height: 6px; border-radius: 3px; background: var(--line-strong); }
.ob-bars span.on { background: var(--primary); }
.ob-lang { margin: 22px 4px 0; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--fg-2); }
.ui-row { display: flex; flex-direction: column; gap: 8px; margin: 18px 4px 0; }
.level-card {
  display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px;
  border-radius: 18px; border: 2px solid var(--line); background: var(--surface); text-align: left;
}
.level-card.is-on { border-color: var(--primary); }
.level-badge {
  width: 48px; height: 48px; flex: none; border-radius: 14px; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;
}
.level-card.is-on .level-badge { background: var(--accent); color: var(--accent-fg); }
.level-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.level-name { font-size: 17px; line-height: 22px; font-weight: 600; }
.level-sub { font-size: 14px; line-height: 19px; color: var(--fg-2); }
.check {
  width: 26px; height: 26px; flex: none; border-radius: 50%; border: 2px solid var(--line-strong);
  display: flex; align-items: center; justify-content: center; color: var(--primary-fg);
}
.is-on .check { background: var(--primary); border-color: var(--primary); }
.goal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.goal {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 16px;
  border-radius: 18px; border: 2px solid var(--line); background: var(--surface); text-align: left;
}
.goal b { font-size: 32px; line-height: 36px; }
.goal span { font-size: 15px; font-weight: 600; }
.goal small { font-size: 13px; line-height: 17px; color: var(--fg-2); }
.goal.is-on { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.goal.is-on small { color: var(--primary-sub); }
.info { display: flex; gap: 12px; padding: 14px 16px; border-radius: 18px; background: var(--soft); color: var(--soft-fg); }
.info p { font-size: 14px; line-height: 20px; }
.info p strong { display: block; font-size: 15px; margin-bottom: 2px; }

/* Home */
.home-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px 4px; }
.streak-chip {
  display: flex; align-items: center; gap: 6px; padding: 8px 12px; margin-bottom: 4px;
  border-radius: 999px; background: var(--surface); font-size: 15px; font-weight: 600; white-space: nowrap;
}
.streak-chip svg, .flame { color: var(--flame); }
.hero { background: var(--hero); color: var(--hero-fg); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.hero-top { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--hero-sub); }
.hero-count { display: flex; align-items: baseline; gap: 10px; }
.hero-count b { font-size: 56px; line-height: 56px; letter-spacing: -1.5px; }
.hero-count span { font-size: 20px; font-weight: 500; }
.hero-title { font-size: 26px; line-height: 32px; font-weight: 700; }
.hero-text { font-size: 15px; line-height: 21px; color: var(--hero-sub); }
.split { display: flex; gap: 4px; height: 10px; }
.split span { border-radius: 5px; min-width: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 15px; }
.legend span { display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.hero .btn-ghost { color: var(--hero-fg); min-height: 48px; }
.hero .btn-ghost small { color: var(--hero-sub); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--fg-2); }
.day i { width: 32px; height: 32px; border-radius: 50%; background: var(--muted); display: flex; align-items: center; justify-content: center; }
.day.done i { background: var(--primary); color: var(--primary-fg); }
.day.today { color: var(--fg); font-weight: 700; }
.day.today i { box-shadow: inset 0 0 0 2px var(--primary); background: var(--accent); color: var(--accent-fg); }
.day.today.done i { box-shadow: none; background: var(--primary); color: var(--primary-fg); }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 22px; line-height: 28px; }
.stat span { font-size: 13px; line-height: 16px; color: var(--fg-2); }
.stats3.on-bg .stat { background: var(--surface); }
.stat.warn { background: var(--warn-bg); color: var(--warn-fg); }
.stat.warn span { color: var(--warn-fg); }
.bar-row { display: flex; flex-direction: column; gap: 6px; }
.bar-label { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.bar-label b { font-weight: 600; }
.bar-label span { color: var(--fg-2); }
.bar { height: 8px; border-radius: 4px; background: var(--muted); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--primary); }

/* Tab bar */
.tabbar {
  flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(var(--sab) + 6px) max(8px, env(safe-area-inset-right, 0px));
}
.tab {
  border: 0; background: none; padding: 2px 0; min-height: 48px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11px; line-height: 13px; font-weight: 500; color: var(--fg-3);
}
.tab[aria-current="page"] { color: var(--fg); font-weight: 600; }

/* Session */
.s-head { flex: none; display: flex; align-items: center; gap: 12px; padding-top: calc(var(--sat) + 12px); }
.progress { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 4px; background: var(--primary); transition: width 0.25s ease; }
.s-count { flex: none; font-size: 15px; font-weight: 600; color: var(--fg-2); }
.s-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-top: 16px; padding-bottom: calc(var(--sab) + 16px); }
.chip { align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: var(--soft); color: var(--soft-fg); font-size: 13px; line-height: 16px; font-weight: 600; }
.chip.new { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.flash { flex: 1 1 auto; min-height: 0; overflow-y: auto; background: var(--surface); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; }
.flash-in { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; width: 100%; }
.label { font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--fg-2); }
.word { font-size: clamp(34px, 11vw, 46px); line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.word.ru { font-size: clamp(28px, 9vw, 38px); }
.ipa-row { display: flex; align-items: center; gap: 12px; margin-top: -4px; }
.ipa { font-size: 17px; color: var(--fg-2); font-family: 'Golos Text', 'Noto Sans', 'Segoe UI', -apple-system, sans-serif; }
.divider { width: 100%; height: 1px; background: var(--line); }
.divider.short { width: 48px; height: 2px; border-radius: 1px; }
.translation { font-size: 26px; line-height: 32px; font-weight: 700; }
.translation small { font-size: 15px; font-weight: 400; color: var(--fg-2); margin-left: 6px; }
.example { font-size: 19px; line-height: 28px; }
.ex-box { width: 100%; padding: 14px 16px; border-radius: 16px; background: var(--surface-2); display: flex; flex-direction: column; gap: 4px; text-align: left; }
.ex-box p:first-child { font-size: 17px; line-height: 24px; }
.ex-box p + p { font-size: 15px; line-height: 21px; color: var(--fg-2); }
.note-box { width: 100%; padding: 14px 16px; border-radius: 16px; background: var(--soft); color: var(--soft-fg); display: flex; gap: 12px; text-align: left; font-size: 15px; line-height: 21px; }
.note-box b { font-weight: 700; }
.my-note { width: 100%; padding: 12px 16px; border-radius: 16px; background: var(--warn-bg); color: var(--warn-fg); text-align: left; font-size: 15px; line-height: 21px; }
.dashed { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; border: 1.5px dashed var(--line-strong); background: transparent; font-size: 15px; font-weight: 600; }
.hint { font-size: 15px; line-height: 20px; color: var(--fg-2); text-align: center; }
.grades { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grade { min-height: 68px; border: 0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; }
.grade b { font-size: 16px; line-height: 21px; }
.grade small { font-size: 13px; line-height: 17px; }
.g-again { background: var(--warn-bg); color: var(--warn-fg); }
.g-hard { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.g-hard small { color: var(--fg-2); }
.g-good { background: var(--primary); color: var(--primary-fg); }
.g-good small { color: var(--primary-sub); }
.q-prompt { display: flex; flex-direction: column; gap: 6px; padding: 8px 4px 4px; }
.q-prompt p { font-size: 17px; color: var(--fg-2); }
.q-prompt h1 { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.4px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  min-height: 56px; padding: 0 20px; border-radius: 16px; border: 2px solid var(--line);
  background: var(--surface); font-size: 20px; font-weight: 600; text-align: left;
}
.opt.right { border-color: var(--primary); background: var(--soft); }
.opt.wrong { border-color: var(--flame); background: var(--warn-bg); color: var(--warn-fg); }
.opt:disabled { cursor: default; }
.feedback { padding: 14px 16px; border-radius: 16px; display: flex; flex-direction: column; gap: 4px; background: var(--soft); color: var(--soft-fg); }
.feedback.bad { background: var(--warn-bg); color: var(--warn-fg); }
.feedback b { font-size: 17px; }
.feedback p { font-size: 15px; line-height: 21px; }
.spacer { flex: 1; }
.fade { animation: fade 0.2s ease; }
@keyframes fade { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Done */
.done-top { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding-top: 20px; }
.done-badge { width: 88px; height: 88px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: flex; align-items: center; justify-content: center; }
.week-bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.week-bars i { height: 8px; border-radius: 4px; background: var(--muted); }
.week-bars i.done { background: var(--primary); }
.week-bars i.today { background: var(--accent); }
.week-bars i.today.done { background: var(--primary); }
.row-card { display: flex; align-items: center; gap: 12px; }
.row-icon { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-text b { font-size: 17px; line-height: 22px; font-weight: 600; }
.row-text span { font-size: 14px; line-height: 19px; color: var(--fg-2); }

/* Words */
.search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--muted); color: var(--fg-2); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: var(--fg); font-size: 17px; outline: none; }
.search input::placeholder { color: var(--fg-3); }
.seg { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: var(--line); }
.seg button { min-height: 34px; border: 0; border-radius: 9px; background: transparent; font-size: 14px; font-weight: 600; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(26, 34, 56, 0.15); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); font-size: 15px; font-weight: 600; }
.chip-btn[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.list { background: var(--surface); border-radius: 20px; padding: 0 16px; }
.list-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.list-row:last-child { border-bottom: 0; }
.list-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.list-word { display: flex; align-items: center; gap: 8px; }
.list-word b { font-size: 17px; line-height: 22px; font-weight: 600; overflow-wrap: anywhere; }

  // ---------- Render ----------
  var app = document.getElementById('app');
  var lastKey = '';
  function viewKey() {
    if (needsOnboarding()) return 'ob-' + ui.ob + '-' + LANG();
    if (ui.session) return 'session';
    return 'tab-' + ui.tab + '-' + LANG();
  }
  function render() {
    try { document.documentElement.lang = UI(); document.documentElement.setAttribute('data-lang', LANG()); } catch (e) { /* ignore */ }
    var key = viewKey();
    var sc = app.querySelector('.scroll');
    var top = sc && key === lastKey ? sc.scrollTop : 0;
    var hadSheet = !!app.querySelector('.sheet');
    var html;
    if (needsOnboarding()) html = viewOnboarding();
    else if (ui.session) html = ui.session.finished ? viewDone() : viewSession();
    else if (ui.tab === 'words') html = viewWords();
    else if (ui.tab === 'settings') html = viewSettings();
    else html = viewHome();
    app.innerHTML = html + (needsOnboarding() ? '' : viewSheet());
    var sc2 = app.querySelector('.scroll');
    if (sc2 && key === lastKey) sc2.scrollTop = top;
    lastKey = key;
    if (ui.sheet && !hadSheet) {
      var first = app.querySelector('.sheet input, .sheet textarea') || app.querySelector('#sheet-title');
      if (first) { try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); } }
    }
  }

  var toastEl = document.createElement('div');
  toastEl.className = 'toast';
  toastEl.setAttribute('role', 'status');
  document.body.appendChild(toastEl);
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function switchLang(k) {
    if (!LANG_TAGS[k] || (S.lang === k)) return;
    ui.prevLang = S.lang && S.langs[S.lang].onboarded ? S.lang : null;
    S.lang = k;
    rebuildIndex();
    ui.wordsLevels = null; ui.query = ''; ui.wordsTab = 'all'; ui.sheet = null;
    if (!L().onboarded) { ui.ob = 'levels'; ui.obFirst = false; }
    else ui.prevLang = null;
    save();
    render();
  }

  // ---------- Actions ----------
  var A = {
    'set-ui': function (el) { var v = el.dataset.ui; if (v !== 'ru' && v !== 'uk') return; S.settings.ui = v; save(); render(); },
    'ob-lang': function (el) { ui.obPick = el.dataset.lang; render(); },
    'ob-lang-next': function () {
      if (!ui.obPick) return;
      S.lang = ui.obPick; rebuildIndex(); ui.ob = 'levels'; ui.obFirst = true; ui.prevLang = null;
      writeLocal(); render();
    },
    'ob-level': function (el) {
      var k = el.dataset.level, lv = L().levels, i = lv.indexOf(k);
      if (i >= 0) lv.splice(i, 1); else lv.push(k);
      lv.sort(function (a, b) { return LEVELS.indexOf(a) - LEVELS.indexOf(b); });
      writeLocal(); render();
    },
    'ob-next': function () { if (L().levels.length) { ui.ob = 'goal'; render(); } },
    'ob-back': function () {
      if (ui.ob === 'goal') { ui.ob = 'levels'; render(); return; }
      if (ui.prevLang) { var p = ui.prevLang; ui.prevLang = null; S.lang = p; rebuildIndex(); writeLocal(); render(); return; }
      if (ui.obFirst) { ui.obPick = S.lang; S.lang = null; ui.ob = 'lang'; rebuildIndex(); writeLocal(); render(); }
    },
    'ob-finish': function () {
      L().onboarded = true; ui.tab = 'home'; ui.prevLang = null; ui.obFirst = false;
      save(); render();
    },
    'set-lang': function (el) { switchLang(el.dataset.lang); },
    'set-goal': function (el) { L().goal = +el.dataset.n; save(); render(); },
    'set-level': function (el) {
      var k = el.dataset.level, lv = L().levels, i = lv.indexOf(k);
      if (i >= 0) { if (lv.length === 1) { toast(t('need_level')); return; } lv.splice(i, 1); } else lv.push(k);
      lv.sort(function (a, b) { return LEVELS.indexOf(a) - LEVELS.indexOf(b); });
      ui.wordsLevels = null;
      save(); render();
    },
    'set-accent': function (el) { S.settings.accent = el.dataset.v; save(); render(); speak('Hello! Let\'s learn some words.'); },
    'toggle-autoplay': function () { S.settings.autoplay = !S.settings.autoplay; save(); render(); },
    'test-voice': function () { speak(LANG() === 'lv' ? 'Labdien! Mācīsimies vārdus.' : 'Hello! Let\'s learn some words.'); },
    'tab': function (el) { ui.tab = el.dataset.tab; ui.sheet = null; render(); },
    'start': function () { startSession(false); },
    'extra': function () { ui.session = null; startSession(true); },
    'close-session': function () {
      var had = ui.session && ui.session.done > 0;
      ui.session = null; ui.tab = 'home'; render();
      if (had) toast(t('t_saved_progress'));
    },
    'done-home': function () { ui.session = null; ui.tab = 'home'; render(); },
    'speak': function (el) { var w = wordById(el.dataset.id); if (w) speak(w.w); },
    'reveal': function () {
      var s = ui.session; s.reveal = true; render();
      var item = current(); if (item && item.dir === 'ru' && S.settings.autoplay) { var w = wordById(item.id); if (w) speak(w.w); }
    },
    'grade': function (el) {
      var g = el.dataset.g, s = ui.session, item = current(), card = L().cards[item.id], d = dayRec(today());
      if (!card) { advance(); return; }
      if (!item.relearn) {
        applyGrade(card, g);
        d.rev++; d.first++; s.stats.rev++; s.stats.first++;
        if (g !== 'again') { d.ok++; s.stats.ok++; }
      }
      if (g === 'again' && (item.again || 0) < 2) {
        s.queue.push({ type: 'review', id: item.id, dir: 'en', relearn: true, again: (item.again || 0) + 1 });
      }
      save(); advance();
    },
    'learn': function () {
      var s = ui.session, item = current();
      s.queue.push({ type: 'quiz', id: item.id, tries: 0 });
      advance();
    },
    'know': function () {
      var s = ui.session, item = current();
      L().cards[item.id] = { s: 'known', added: today() };
      if (s.skips < 30) {
        var next = newPool().filter(function (w) { return !s.used[w.id]; })[0];
        if (next) { s.used[next.id] = true; s.queue.splice(s.idx + 1, 0, { type: 'new', id: next.id }); s.skips++; }
      }
      save(); advance();
    },
    'pick': function (el) {
      var s = ui.session, item = current(), cs = L().cards;
      if (item.picked != null) return;
      var i = +el.dataset.i, right = item.opts[i] === item.id, d = dayRec(today());
      item.picked = i;
      if (!item.tries) { s.stats.first++; d.first++; if (right) { s.stats.ok++; d.ok++; } }
      if (right || item.tries >= 2) {
        if (!cs[item.id] || cs[item.id].s !== 'review') { cs[item.id] = newCard(); d.nw++; s.stats.learned++; }
      } else {
        item.requeued = true;
        s.queue.push({ type: 'quiz', id: item.id, tries: (item.tries || 0) + 1 });
      }
      save(); render();
      var w = wordById(item.id); if (w && S.settings.autoplay) speak(w.w);
    },
    'next': function () { advance(); },
    'open-word': function (el) { ui.sheet = { type: 'word', id: el.dataset.id }; render(); },
    'sheet-close': function () { ui.sheet = null; render(); },
    'word-known': function (el) { L().cards[el.dataset.id] = { s: 'known', added: today() }; save(); ui.sheet = null; render(); toast(t('t_known')); },
    'word-reset': function (el) { delete L().cards[el.dataset.id]; save(); ui.sheet = null; render(); toast(t('t_relearn')); },
    'word-delete': function (el) {
      var id = el.dataset.id, l = L();
      l.custom = l.custom.filter(function (w) { return w.id !== id; });
      delete l.cards[id]; delete l.notes[id];
      rebuildIndex(); save(); ui.sheet = null; render(); toast(t('t_deleted'));
    },
    'add-word': function () { ui.sheet = { type: 'add' }; render(); },
    'note-edit': function (el) { ui.sheet = { type: 'note', id: el.dataset.id, back: ui.sheet }; render(); },
    'words-tab': function (el) { ui.wordsTab = el.dataset.t; render(); },
    'words-level': function (el) {
      var lv = (ui.wordsLevels || defaultWordLevels()).slice(), k = el.dataset.l, i = lv.indexOf(k);
      if (i >= 0) lv.splice(i, 1); else lv.push(k);
      ui.wordsLevels = lv; render();
    },
    'export': function () { exportBackup(); },
    'reset-ask': function () { ui.sheet = { type: 'confirm', kind: 'reset' }; render(); },
    'confirm-yes': function () {
      var sh = ui.sheet;
      if (sh.kind === 'reset') {
        var l = L();
        l.cards = {}; l.days = {}; l.notes = {};
        save(); toast(t('t_reset'));
      } else if (sh.kind === 'import' && sh.data) {
        var keepUi = S.settings.ui;
        S = migrate(sh.data);
        if (!sh.data.langs) S.settings.ui = keepUi;
        rebuildIndex(); save(); toast(t('t_restored'));
        ui.ob = S.lang ? 'levels' : 'lang'; ui.obFirst = !S.lang;
      }
      ui.sheet = null; ui.tab = 'home'; render();
    }
  };

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || !app.contains(el) || el.disabled) return;
    var fn = A[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el); }
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, data = new FormData(f), l = L();
    if (f.dataset.form === 'add') {
      var w = String(data.get('w') || '').trim(), ru = String(data.get('ru') || '').trim();
      if (!w || !ru) { toast(t('t_need')); return; }
      var exists = allWords().filter(function (x) { return x.w.toLowerCase() === w.toLowerCase(); })[0];
      if (exists) { ui.sheet = { type: 'word', id: exists.id }; render(); toast(t('t_exists')); return; }
      var id = 'my-' + Date.now().toString(36);
      l.custom.push({ id: id, lvl: 'MY', w: w, ipa: '', pos: '', ru: ru, ex: String(data.get('ex') || '').trim(), exRu: String(data.get('exRu') || '').trim(), note: '' });
      rebuildIndex(); ui.wordsLevels = null; save();
      ui.sheet = null; render(); toast(t('t_added'));
    } else if (f.dataset.form === 'note') {
      var sh = ui.sheet, text = String(data.get('note') || '').trim();
      if (text) l.notes[sh.id] = text; else delete l.notes[sh.id];
      save();
      ui.sheet = sh.back && sh.back.type === 'word' ? sh.back : null;
      render(); toast(text ? t('t_note_saved') : t('t_note_deleted'));
    }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'q') {
      ui.query = e.target.value;
      var box = document.getElementById('word-list');
      if (box) box.innerHTML = wordListHtml();
    }
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) {
      var file = e.target.files[0];
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(String(reader.result));
          if (!data || typeof data !== 'object' || !(data.langs || data.cards)) throw new Error('bad');
          var m = migrate(JSON.parse(String(reader.result)));
          var n = LANG_KEYS.reduce(function (a, k) { return a + Object.keys(m.langs[k].cards).length; }, 0);
          ui.sheet = { type: 'confirm', kind: 'import', data: data, info: t('in_work', { w: wordsN(n) }) };
          render();
        } catch (err) { toast(t('t_bad_file')); }
      };
      reader.onerror = function () { toast(t('t_read_fail')); };
      reader.readAsText(file);
      e.target.value = '';
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !ui.session && !ui.sheet) render();
    if (document.visibilityState === 'hidden') flushRemote();
  });

  // ---------- Backup ----------
  function exportBackup() {
    var data = JSON.stringify(S);
    var filename = 'slova-progress-' + today() + '.json';
    var claude = window.claude;
    if (claude && typeof claude.use === 'function') {
      claude.use('downloads').then(function (dl) {
        if (!dl) { toast(t('t_dl_na')); return; }
        dl.save({ filename: filename, data: data }).then(function () { toast(t('t_copy_saved')); }, function (err) {
          if (!err || err.code !== 'declined') toast(t('t_save_fail'));
        });
      });
      return;
    }
    var blob = new Blob([data], { type: 'application/json' });
    try {
      var file = new File([blob], filename, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: t('share_title') }).catch(function () { /* cancelled */ });
        return;
      }
    } catch (e) { /* fall through to download */ }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast(t('t_copy_saved'));
  }

  // ---------- Sync inside Claude (artifact) ----------
  var remoteRef = null, remoteTimer = null;

  };
  render();
  initRemote();
